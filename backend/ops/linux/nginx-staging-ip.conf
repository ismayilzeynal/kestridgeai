# Staging only: serves both the site and the API from the bare IP over plain
# HTTP, because api.kestridge.com does not resolve yet and there is therefore no
# certificate.
#
# Install as /etc/nginx/sites-available/kestridge-staging
#
# Why both on one server block: the browser then sees one origin, so the contact
# form posts same-origin to /api/contact. Serving the site over HTTPS from
# Vercel and the API over plain HTTP from an IP is not an option, because the
# browser blocks that as mixed content.
#
# THIS IS NOT PRODUCTION. There is no TLS, so form submissions cross the network
# in cleartext. Do not put real client data through it. Replace with
# nginx-api.conf as soon as DNS and the certificate exist, and disable
# kestridge-web.service so the site is served from Vercel again.

limit_req_zone $binary_remote_addr zone=kestridge_staging_flood:10m rate=30r/s;

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    client_max_body_size 64k;
    client_body_timeout 10s;
    client_header_timeout 10s;
    server_tokens off;

    # Kept above any future redirect, so issuing a certificate later does not
    # need this file edited in a hurry.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        default_type "text/plain";
        allow all;
    }

    location /api/ {
        limit_req zone=kestridge_staging_flood burst=60 nodelay;

        proxy_pass http://127.0.0.1:5199;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_send_timeout    30s;
        proxy_read_timeout    30s;

        # Off, so the app's own error bodies and its
        # Access-Control-Allow-Origin header survive. See nginx-api.conf.
        proxy_intercept_errors off;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Next.js uses these for its dev overlay and for streaming responses.
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_connect_timeout 5s;
        proxy_read_timeout    60s;
    }
}
