# Phase 1 only: plain HTTP, just enough for certbot to answer the ACME
# challenge. Replaced by nginx-api.conf once the certificate exists.
#
# Install as /etc/nginx/sites-available/api.kestridge.com

server {
    listen 80;
    listen [::]:80;
    server_name api.kestridge.com;

    # certbot --nginx writes the challenge under this root.
    root /var/www/html;

    location ^~ /.well-known/acme-challenge/ {
        default_type "text/plain";
        allow all;
    }

    location / {
        return 404;
    }
}
