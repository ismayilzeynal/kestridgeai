# Phase 2: the real config. Install as
#   /etc/nginx/sites-available/api.kestridge.com
# after certbot has issued the certificate.
#
# Ubuntu 24.04 ships nginx 1.24.0. The standalone "http2 on;" directive did not
# arrive until 1.25.1, so this uses the "listen ... http2" form. If you ever move
# to 1.25.1+ that form logs a deprecation warning and you switch.

# Coarse flood protection only. The application's own limiter is 5 per 10
# minutes per IP and 200 per hour globally, and its 429 carries
# Access-Control-Allow-Origin while nginx's does not. Keep this loose enough
# that the app's limiter is the one that ever fires in normal operation.
limit_req_zone $binary_remote_addr zone=kestridge_flood:10m rate=30r/s;

server {
    listen 80;
    listen [::]:80;
    server_name api.kestridge.com;

    # Must stay ABOVE the redirect, or renewals start failing silently 60 days
    # from now and Let's Encrypt no longer sends expiry email to warn you.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        default_type "text/plain";
        allow all;
    }

    location / {
        return 308 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.kestridge.com;

    ssl_certificate     /etc/letsencrypt/live/api.kestridge.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.kestridge.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # 64k, not 128k. Kestrel's MaxRequestBodySize is 128 KB but the endpoint's
    # real ceiling is FormOptions.MultipartBodyLengthLimit = 64 KB, so reject at
    # the edge rather than 64 KB into a request the app will refuse anyway.
    client_max_body_size 64k;
    client_body_timeout  10s;
    client_header_timeout 10s;

    server_tokens off;

    # An API that returns JSON and is never rendered as a document. CSP,
    # X-Frame-Options and Referrer-Policy do nothing here; these two do.
    add_header X-Content-Type-Options nosniff always;
    add_header Strict-Transport-Security "max-age=63072000" always;

    # The app maps exactly two routes and CORS only permits POST.
    if ($request_method !~ ^(GET|POST|HEAD|OPTIONS)$) {
        return 405;
    }

    location / {
        limit_req zone=kestridge_flood burst=60 nodelay;

        proxy_pass http://127.0.0.1:5199;
        proxy_http_version 1.1;

        # X-Forwarded-For is what UseForwardedHeaders reads to restore the real
        # client address, and the rate limiter partitions on that address. Drop
        # this and every visitor on earth shares one 5-per-10-minutes bucket.
        # X-Forwarded-Proto is the other header ForwardedHeadersOptions enables.
        # X-Real-IP, X-Forwarded-Host and X-Forwarded-Port are not read by
        # ASP.NET Core here and are deliberately not set.
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_send_timeout    30s;
        proxy_read_timeout    30s;

        # OFF, deliberately. With it on, nginx replaces the app's own error
        # bodies and strips the Access-Control-Allow-Origin header that
        # Program.cs keeps on a 500 on purpose. The browser would then report an
        # opaque network failure for a submission that was already stored, and
        # the visitor resubmits: duplicate rows, duplicate notification mail, and
        # a "broken form" report with no matching server error. CorsTests pins
        # the app-side behaviour; this keeps nginx from undoing it.
        proxy_intercept_errors off;
    }
}

# Anything arriving with an unknown Host, including a bare IP scan, gets no
# certificate and no response.
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;
    ssl_reject_handshake on;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 444;
}
